<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIGH TECH PS - Host</title>

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d4af37">

  <!-- Style Sheets -->
  <link rel="stylesheet" href="includes/style.css">

  <!-- Core Legacy Compatibility -->
  <script src="includes/applicationCache.js"></script>
</head>
<body>

  <!-- شريط تقدم التحميل الأوفلاين -->
  <div id="top-progress-container">
    <div id="top-progress-bar"></div>
    <span id="top-progress-text">0% - INITIALIZING SERVICE WORKER...</span>
  </div>

  <!-- خلفية الصفحة -->
  <div class="full-bg">
    <img src="background.png" alt="HIGH TECH PS" onerror="this.style.display='none';">
  </div>

  <!-- طبقة التظليل -->
  <div class="overlay"></div>

  <!-- الواجهة الرئيسية -->
  <div class="main-card">
    <button class="seal-btn" id="masterBtn">
      <div class="seal-inner">
        <div class="seal-title">HIGH TECH PS</div>
        <div class="seal-divider"></div>
        <div class="seal-subtitle">GOLD HEN / PSFREE</div>
        <div class="seal-version">FW 5.05 - 11.02 SUPPORTED</div>
      </div>
    </button>

    <!-- شاشة إظهار السجلات والتنبيهات -->
    <pre id="console" class="console-box">Ready. Awaiting execution...</pre>
  </div>

  <!-- Core Scripts -->
  <script src="src/main.js"></script>
  <script src="includes/script.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js', { scope: './' })
          .then(function(reg) {
            console.log('ServiceWorker registered successfully with scope:', reg.scope);
            var bar = document.getElementById('top-progress-bar');
            var text = document.getElementById('top-progress-text');
            if (bar && text) {
              bar.style.width = '100%';
              text.textContent = '100% - SERVICE WORKER READY (OFFLINE ACTIVE)';
            }
          })
          .catch(function(err) {
            console.error('ServiceWorker registration failed:', err);
            var text = document.getElementById('top-progress-text');
            if (text) {
              text.textContent = 'SERVICE WORKER ERROR!';
            }
          });
      });
    }
  </script>
</body>
</html>
