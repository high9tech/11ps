<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIGH TECH PS - Host</title>

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d4af37">

  <!-- Style Sheets -->
  <link rel="stylesheet" href="includes/style.css">
</head>
<body>

  <!-- شريط تقدم التحميل -->
  <div id="top-progress-container">
    <div id="top-progress-bar" style="width: 0%;"></div>
    <span id="top-progress-text">0% - INITIALIZING SERVICE WORKER...</span>
  </div>

  <!-- خلفية الصفحة -->
  <div class="full-bg">
    <img src="background.png" alt="HIGH TECH PS" onerror="this.style.display='none';">
  </div>

  <!-- طبقة التظليل -->
  <div class="overlay"></div>

  <!-- الواجهة الرئيسية -->
  <div class="main-card">
    <button class="seal-btn" id="masterBtn">
      <div class="seal-inner">
        <div class="seal-title">HIGH TECH PS</div>
        <div class="seal-divider"></div>
        <div class="seal-subtitle">GOLD HEN / PSFREE</div>
        <div class="seal-version">FW 5.05 - 11.02 SUPPORTED</div>
      </div>
    </button>

    <!-- شاشة إظهار السجلات والتنبيهات -->
    <pre id="console" class="console-box">Ready. Awaiting execution...</pre>
  </div>

  <!-- Core Scripts -->
  <script src="src/main.js"></script>
  <script src="includes/script.js"></script>

  <!-- Service Worker Registration -->
  <script>
    function updateProgress(percent, statusText) {
      var bar = document.getElementById('top-progress-bar');
      var text = document.getElementById('top-progress-text');
      if (bar) bar.style.width = percent + '%';
      if (text) text.textContent = percent + '% - ' + statusText;
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        updateProgress(30, 'REGISTERING SERVICE WORKER...');
        
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) {
            updateProgress(70, 'CACHING FILES FOR OFFLINE...');

            // في حال كان الكاش جاهزاً ومفعلاً مسبقاً
            if (reg.active) {
              updateProgress(100, 'OFFLINE CACHE ACTIVE & READY');
            }

            // الاستماع لتغيرات حالة الخدمة لضمان التحديث عند الانتهاء
            reg.onupdatefound = function() {
              var installingWorker = reg.installing;
              installingWorker.onstatechange = function() {
                if (installingWorker.state === 'installed') {
                  if (navigator.serviceWorker.controller) {
                    updateProgress(100, 'OFFLINE CACHE UPDATED');
                  } else {
                    updateProgress(100, 'OFFLINE CACHE ACTIVE & READY');
                  }
                }
              };
            };
          })
          .catch(function(err) {
            console.error('ServiceWorker registration failed:', err);
            var text = document.getElementById('top-progress-text');
            if (text) text.textContent = 'SERVICE WORKER ERROR!';
          });
      });
    }
  </script>
</body>
</html>
